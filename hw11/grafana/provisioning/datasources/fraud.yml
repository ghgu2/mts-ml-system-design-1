apiVersion: 1

datasources:
  - name: Prometheus
    uid: hw11-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 2s

  - name: PostgreSQL
    uid: hw11-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: scores_reader
    editable: false
    jsonData:
      database: fraud_monitoring
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      timeInterval: 1s
    secureJsonData:
      password: $HW11_READER_PASSWORD
