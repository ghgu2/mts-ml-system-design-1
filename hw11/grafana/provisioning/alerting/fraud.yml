apiVersion: 1

muteTimes:
  - orgId: 1
    name: hw11-local-only
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: grafana-default-email
        object_matchers:
          - [grafana_folder, "=", Антифрод]
        mute_time_intervals: [hw11-local-only]

groups:
  - orgId: 1
    name: scoring-health
    folder: Антифрод
    interval: 10s
    rules:
      - uid: hw11-scoring-stalled
        title: Поток скоринга остановился
        condition: B
        for: 30s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Скоринг обрабатывает меньше 0,05 транзакции в секунду за последние 30 секунд.
        data:
          - refId: A
            datasourceUid: hw11-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              expr: sum(rate(fraud_scoring_processed_total[30s])) or vector(0)
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              expression: "$A < 0.05"
              datasource: {type: __expr__, uid: __expr__}

      - uid: hw11-score-writer-lag
        title: Запись скоров отстаёт
        condition: B
        for: 30s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Скоринг выдаёт более чем на 0,5 результата в секунду больше, чем сохраняется в PostgreSQL.
        data:
          - refId: A
            datasourceUid: hw11-prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              expr: >-
                (sum(rate(fraud_scoring_processed_total[30s])) or vector(0))
                - (sum(rate(fraud_writer_scores_written_total[30s])) or vector(0))
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: math
              expression: "$A > 0.5"
              datasource: {type: __expr__, uid: __expr__}
