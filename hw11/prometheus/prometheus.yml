global:
  scrape_interval: 5s
  scrape_timeout: 3s

scrape_configs:
  - job_name: scorer
    scrape_interval: 2s
    scrape_timeout: 1s
    static_configs:
      - targets: ["fraud_detector:8000"]
  - job_name: score_writer
    scrape_interval: 2s
    scrape_timeout: 1s
    static_configs:
      - targets: ["scoring_writer:8001"]
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
