name: mts-ml-hw2

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - hw2-kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  kafka-setup:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, -ec]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic hw2-transactions
        --partitions 1 --replication-factor 1

  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: hw2
      CLICKHOUSE_USER: hw2
      CLICKHOUSE_PASSWORD: hw2-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${HW2_HTTP_PORT:-8123}:8123"
    volumes:
      - hw2-clickhouse:/var/lib/clickhouse
      - ./hw2/sql/01_baseline.sql:/docker-entrypoint-initdb.d/01_baseline.sql:ro
      - ./hw2/sql/02_optimized.sql:/docker-entrypoint-initdb.d/02_optimized.sql:ro
      - ./hw2/clickhouse/config.xml:/etc/clickhouse-server/config.d/hw2.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user hw2 --password hw2-local --query 'EXISTS TABLE hw2.transactions_ingest_mv' | grep -qx 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  pipeline:
    build:
      context: ./hw2
    profiles: [tools]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: hw2-transactions
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: hw2
      CLICKHOUSE_PASSWORD: hw2-local
    volumes:
      - ${HW2_DATA_DIR:-./examples}:/data:ro
      - ./hw2/results:/results
    command: [python, run_pipeline.py, --csv, "/data/${HW2_DATA_FILE:-hw2_sample.csv}", --output-dir, /results]

volumes:
  hw2-kafka:
  hw2-clickhouse:
