name: mlops-hw3

x-airflow: &airflow
  image: mlops-hw3-airflow:local
  build:
    context: .
    dockerfile: hw3/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: hw3-local-demo-secret
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    HW3_DATA_DIR: /data
    MODELS_DIR: /models
    REPORTS_DIR: /reports
    WINDOW_MONTHS: ${HW3_WINDOW_MONTHS:-3}
    HISTORY_MONTHS: ${HW3_HISTORY_MONTHS:-36}
    BATCH_SIZE: ${HW3_BATCH_SIZE:-10000}
  volumes:
    - training_data:/data
    - model_registry:/models
    - dq_reports:/reports
    - airflow_logs:/opt/airflow/logs
  networks: [ml-scorer]

services:
  volume-init:
    <<: *airflow
    user: "0:0"
    entrypoint: /bin/bash
    command: ["-ec", "chown 50000:0 /data /models /reports /opt/airflow/logs"]

  postgres:
    image: postgres:15.10
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes: [airflow_db:/var/lib/postgresql/data]
    networks: [ml-scorer]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command:
      - bash
      - -ec
      - |
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json,sys; sys.exit(not any(u["username"] == "admin" for u in json.load(sys.stdin)))'; then
          airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
        fi
    depends_on:
      postgres: {condition: service_healthy}
      volume-init: {condition: service_completed_successfully}

  bootstrap:
    <<: *airflow
    environment:
      <<: *airflow-env
      LABELED_CSV_PATH: /input/${HW3_TRAIN_FILE:-hw3_train.csv}
    volumes:
      - training_data:/data
      - model_registry:/models
      - dq_reports:/reports
      - ${HW3_INPUT_DIR:-./examples}:/input:ro
    command: ["python", "-m", "hw3_pipeline.initialize"]
    depends_on:
      volume-init: {condition: service_completed_successfully}

  airflow:
    <<: *airflow
    command: webserver
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  reports:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8082", "--directory", "/reports"]
    ports: ["127.0.0.1:8082:8082"]
    volumes: [dq_reports:/reports:ro]
    networks: [ml-scorer]
    restart: unless-stopped

  simulator:
    <<: *airflow
    command: ["python", "-m", "hw3_pipeline.simulator"]
    depends_on:
      kafka-setup: {condition: service_completed_successfully}
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped

  verify:
    <<: *airflow
    profiles: [tools]
    command: ["python", "-m", "hw3_pipeline.verify"]
    depends_on:
      airflow: {condition: service_healthy}
      airflow-scheduler: {condition: service_healthy}
      fraud_detector: {condition: service_started}

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [ml-scorer]

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:19095:19095"
    environment:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [ml-scorer]

  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic scoring --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --list
    networks: [ml-scorer]

  fraud_detector:
    build: ./fraud_detector
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTIONS_TOPIC: transactions
      KAFKA_SCORING_TOPIC: scoring
      MODELS_DIR: /models
    volumes:
      - model_registry:/models:ro
    restart: unless-stopped
    networks: [ml-scorer]

  interface:
    build: ./interface
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transactions
    ports:
      - "127.0.0.1:18501:8501"
    restart: unless-stopped
    networks: [ml-scorer]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:18080:8080"
    networks: [ml-scorer]

networks:
  ml-scorer:
    driver: bridge

volumes:
  training_data:
  model_registry:
  dq_reports:
  airflow_logs:
  airflow_db:
